<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="960" y2="440" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#070b18"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#131026"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <radialGradient id="glow1" cx="0.25" cy="0.3" r="0.5">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.78" cy="0.7" r="0.5">
      <stop offset="0%" stop-color="#c084fc" stop-opacity="0.24"/>
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="960" height="440" rx="24" fill="url(#bg)"/>
  <rect width="960" height="440" rx="24" fill="url(#glow1)"/>
  <rect width="960" height="440" rx="24" fill="url(#glow2)"/>

  <!-- Subtle grid -->
  <g stroke="#94a3b8" stroke-opacity="0.08" stroke-width="1">
    <line x1="0" y1="110" x2="960" y2="110"/>
    <line x1="0" y1="220" x2="960" y2="220"/>
    <line x1="0" y1="330" x2="960" y2="330"/>
    <line x1="240" y1="0" x2="240" y2="440"/>
    <line x1="480" y1="0" x2="480" y2="440"/>
    <line x1="720" y1="0" x2="720" y2="440"/>
  </g>

  <!-- Title -->
  <text x="480" y="64" text-anchor="middle" fill="#e2e8f0" font-family="sans-serif" font-size="20" font-weight="700" letter-spacing="2">
    WUJI MARKDOWN &amp; LATEX RENDERING PIPELINE
  </text>
  <text x="480" y="90" text-anchor="middle" fill="#94a3b8" font-family="monospace" font-size="13">
    .md Source  →  AST + KaTeX + Highlight.js  →  Editorial Web Article
  </text>

  <!-- Nodes -->
  <g>
    <!-- Box 1 -->
    <rect x="64" y="154" width="212" height="142" rx="18" fill="#0f172a" fill-opacity="0.86" stroke="#38bdf8" stroke-opacity="0.55" stroke-width="1.5"/>
    <text x="170" y="196" text-anchor="middle" fill="#38bdf8" font-family="monospace" font-size="13" font-weight="600">01 · MARKDOWN</text>
    <text x="170" y="226" text-anchor="middle" fill="#f8fafc" font-family="sans-serif" font-size="16" font-weight="700">原始写作文件</text>
    <text x="170" y="254" text-anchor="middle" fill="#94a3b8" font-family="monospace" font-size="12">$$LaTeX$$ · ==高亮==</text>
    <text x="170" y="274" text-anchor="middle" fill="#94a3b8" font-family="monospace" font-size="12">[[引用]] · [!TIP]</text>

    <!-- Arrow 1 -->
    <path d="M286 225 L364 225" stroke="url(#accent)" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M356 218 L366 225 L356 232" stroke="#818cf8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Box 2 -->
    <rect x="374" y="154" width="212" height="142" rx="18" fill="#0f172a" fill-opacity="0.86" stroke="#818cf8" stroke-opacity="0.6" stroke-width="1.5"/>
    <text x="480" y="196" text-anchor="middle" fill="#818cf8" font-family="monospace" font-size="13" font-weight="600">02 · COMPILER</text>
    <text x="480" y="226" text-anchor="middle" fill="#f8fafc" font-family="sans-serif" font-size="16" font-weight="700">无极解析管线</text>
    <text x="480" y="254" text-anchor="middle" fill="#94a3b8" font-family="monospace" font-size="12">Marked + KaTeX + hljs</text>
    <text x="480" y="274" text-anchor="middle" fill="#94a3b8" font-family="monospace" font-size="12">TOC · Footnotes · Stats</text>

    <!-- Arrow 2 -->
    <path d="M596 225 L674 225" stroke="url(#accent)" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M666 218 L676 225 L666 232" stroke="#c084fc" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Box 3 -->
    <rect x="684" y="154" width="212" height="142" rx="18" fill="#0f172a" fill-opacity="0.86" stroke="#c084fc" stroke-opacity="0.55" stroke-width="1.5"/>
    <text x="790" y="196" text-anchor="middle" fill="#c084fc" font-family="monospace" font-size="13" font-weight="600">03 · EXPERIENCE</text>
    <text x="790" y="226" text-anchor="middle" fill="#f8fafc" font-family="sans-serif" font-size="16" font-weight="700">美学前端文章</text>
    <text x="790" y="254" text-anchor="middle" fill="#94a3b8" font-family="monospace" font-size="12">双主题 · 图片灯箱</text>
    <text x="790" y="274" text-anchor="middle" fill="#94a3b8" font-family="monospace" font-size="12">代码复制 · 站内跳转</text>
  </g>

  <!-- Bottom formula ribbon -->
  <rect x="190" y="346" width="580" height="48" rx="12" fill="#1e293b" fill-opacity="0.55" stroke="#38bdf8" stroke-opacity="0.25"/>
  <text x="480" y="376" text-anchor="middle" fill="#cbd5e1" font-family="monospace" font-size="14">
    e^{iπ} + 1 = 0   ·   无极而太极，动静生万象   ·   60 FPS Motion
  </text>
</svg>
